/* ===================== rng ===================== */
function mkRng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
var rnd=mkRng((Date.now()^0x9e3779b9)>>>0);

/* ===================== maze (infinite, Eller-style strip generation in any of 4 directions) ===================== */
/* World = global tile lattice: cells sit on (odd,odd) tiles, walls/passages on the rest. Tiles live in a 64x64 toroidal
   buffer; the "rect" [x0..x1]x[y0..y1] is the currently valid region (never larger than 64 in either axis).
   Vertical phases (up/down) are 19 tiles wide and generate rows ahead; horizontal phases (left/right) are 33 tiles tall
   and generate columns ahead. A direction switch re-bases the rect on the current (aligned) view window, repairs it
   (closes borders, removes dead ends, merges components) and continues Eller's algorithm from that seam. */
var M={
  tiles:new Uint8Array(4096), items:new Uint8Array(4096),
  x0:0,x1:18,y0:0,y1:0,vert:true,d:0,lead:0,sgn:-1,a0:0,n:9,
  nextSet:1,rnd:null,powerCd:3,cnt:0,
  sets:new Int32Array(18),fwd:new Uint8Array(18),pf:new Uint8Array(18),hl:new Uint8Array(18),tmp:new Uint8Array(18),opt:new Uint8Array(3),
  reset:function(seed){
    this.tiles.fill(1);this.items.fill(0);this.x0=0;this.x1=18;this.y0=0;this.y1=0;this.vert=true;this.d=0;this.lead=0;this.sgn=-1;
    this.a0=0;this.n=9;this.nextSet=1;this.powerCd=3;this.cnt=0;this.pf.fill(0);this.fwd.fill(0);this.hl.fill(0);this.sets.fill(0);
    this.rnd=mkRng(seed);
  },
  wx:function(x){if(this.vert){if(x<this.x0)return x+19;if(x>this.x1)return x-19;}return x;},
  wy:function(y){if(!this.vert){if(y<this.y0)return y+33;if(y>this.y1)return y-33;}return y;},
  inRect:function(x,y){return x>=this.x0&&x<=this.x1&&y>=this.y0&&y<=this.y1;},
  open:function(x,y){
    if(this.vert){if(x<this.x0)x+=19;else if(x>this.x1)x-=19;}
    else{if(y<this.y0)y+=33;else if(y>this.y1)y-=33;}
    if(x<this.x0||x>this.x1||y<this.y0||y>this.y1)return false;
    return this.tiles[(x&63)|((y&63)<<6)]===0;
  },
  item:function(x,y){
    if(x<this.x0||x>this.x1||y<this.y0||y>this.y1)return 0;
    return this.items[(x&63)|((y&63)<<6)];
  },
  put:function(u,v,val){
    var x=this.vert?v:u,y=this.vert?u:v,i=(x&63)|((y&63)<<6);
    this.tiles[i]=val;if(val)this.items[i]=0;
  },
  gen:function(){
    var cl=this.lead,sg=this.sgn,rl=cl+sg,a0=this.a0,n=this.n,r=this.rnd,c,j,q,m,v,i;
    var sets=this.sets,fwd=this.fwd,pf=this.pf,hl=this.hl,tmp=this.tmp,opt=this.opt;
    for(v=a0;v<=a0+2*n;v++){this.put(cl,v,1);this.put(rl,v,1);}
    for(c=0;c<n;c++){if(pf[c])this.put(cl,a0+2*c+1,0);else sets[c]=this.nextSet++;}
    for(c=0;c<n-1;c++){
      hl[c]=0;var a=sets[c],b=sets[c+1];
      if(a!==b){if(r()<0.6){hl[c]=1;for(j=0;j<n;j++)if(sets[j]===b)sets[j]=a;}}
      else if(r()<0.2)hl[c]=1;
    }
    for(c=0;c<n;c++)fwd[c]=0;
    for(c=0;c<n;c++){
      var s=sets[c],first=true;
      for(j=0;j<c;j++)if(sets[j]===s){first=false;break;}
      if(!first)continue;
      m=0;for(j=c;j<n;j++)if(sets[j]===s)tmp[m++]=j;
      fwd[tmp[(r()*m)|0]]=1;
      for(q=0;q<m;q++)if(r()<0.35)fwd[tmp[q]]=1;
    }
    var tun=(this.cnt>=1&&r()<0.14)?1:0;
    for(c=0;c<n;c++){
      var cnt=(pf[c]?1:0)+((c>0&&hl[c-1])?1:0)+((c<n-1&&hl[c])?1:0)+fwd[c]+((c===0&&tun)?1:0)+((c===n-1&&tun)?1:0);
      if(cnt<=1){
        m=0;
        if(c>0&&!hl[c-1])opt[m++]=0;
        if(c<n-1&&!hl[c])opt[m++]=1;
        if(!fwd[c])opt[m++]=2;
        if(m>0){var o=opt[(r()*m)|0];if(o===0)hl[c-1]=1;else if(o===1)hl[c]=1;else fwd[c]=1;}
      }
    }
    for(c=0;c<n;c++){
      this.put(rl,a0+2*c+1,0);
      if(c<n-1&&hl[c])this.put(rl,a0+2*c+2,0);
    }
    if(tun){this.put(rl,a0,0);this.put(rl,a0+2*n,0);}
    for(v=a0;v<=a0+2*n;v++){
      for(i=0;i<2;i++){
        var u=i?rl:cl,x=this.vert?v:u,y=this.vert?u:v,k=(x&63)|((y&63)<<6);
        if(this.tiles[k]===0)this.items[k]=1;
      }
    }
    if(this.cnt>=3){if(--this.powerCd<=0){c=(r()*n)|0;var pu=rl,pv=a0+2*c+1,px=this.vert?pv:pu,py=this.vert?pu:pv;this.items[(px&63)|((py&63)<<6)]=2;this.powerCd=8+((r()*7)|0);}}
    for(c=0;c<n;c++)pf[c]=fwd[c];
    this.lead=cl+2*sg;this.cnt++;
    var d=this.d;
    if(d===0){this.y0=rl;this.y1=Math.min(this.y1,rl+63);}
    else if(d===2){this.y1=rl;this.y0=Math.max(this.y0,rl-63);}
    else if(d===1){this.x0=rl;this.x1=Math.min(this.x1,rl+63);}
    else{this.x1=rl;this.x0=Math.max(this.x0,rl-63);}
  },
  /* re-base on the aligned 19x33 window (wx0,wy0 even) and continue generating in direction d */
  switchTo:function(d,wx0,wy0){
    var x0=wx0,x1=wx0+18,y0=wy0,y1=wy0+32,x,y,i,j,k,r=this.rnd,t=this.tiles,it=this.items,NC=9,NR=16;
    for(y=y0;y<=y1;y++)for(x=x0;x<=x1;x++){
      if(!(x>=this.x0&&x<=this.x1&&y>=this.y0&&y<=this.y1)){k=(x&63)|((y&63)<<6);t[k]=((x&1)&&(y&1))?0:1;it[k]=0;}
    }
    this.x0=x0;this.x1=x1;this.y0=y0;this.y1=y1;this.d=d;this.vert=(d===0||d===2);
    for(x=x0;x<=x1;x++){k=(x&63)|((y0&63)<<6);t[k]=1;it[k]=0;k=(x&63)|((y1&63)<<6);t[k]=1;it[k]=0;}
    for(y=y0;y<=y1;y++){k=(x0&63)|((y&63)<<6);t[k]=1;it[k]=0;k=(x1&63)|((y&63)<<6);t[k]=1;it[k]=0;}
    function kx(px,py){return (px&63)|((py&63)<<6);}
    function isOpen(px,py){return t[kx(px,py)]===0;}
    function opn(px,py){var q=kx(px,py);t[q]=0;if(!it[q])it[q]=1;}
    // right link of cell (i,j) at (x0+2i+2,y0+2j+1); down link at (x0+2i+1,y0+2j+2)
    var cnt;
    for(j=0;j<NR;j++)for(i=0;i<NC;i++){
      var cxp=x0+2*i+1,cyp=y0+2*j+1;
      cnt=(i<NC-1&&isOpen(cxp+1,cyp)?1:0)+(i>0&&isOpen(cxp-1,cyp)?1:0)+(j<NR-1&&isOpen(cxp,cyp+1)?1:0)+(j>0&&isOpen(cxp,cyp-1)?1:0);
      if(cnt<=1){
        var cand=[];
        if(i<NC-1&&!isOpen(cxp+1,cyp))cand.push(0);
        if(i>0&&!isOpen(cxp-1,cyp))cand.push(1);
        if(j<NR-1&&!isOpen(cxp,cyp+1))cand.push(2);
        if(j>0&&!isOpen(cxp,cyp-1))cand.push(3);
        var o=cand[(r()*cand.length)|0];
        if(o===0)opn(cxp+1,cyp);else if(o===1)opn(cxp-1,cyp);else if(o===2)opn(cxp,cyp+1);else opn(cxp,cyp-1);
      }
    }
    var p=new Int16Array(NC*NR),comps=NC*NR;
    for(i=0;i<p.length;i++)p[i]=i;
    function find(a){while(p[a]!==a){p[a]=p[p[a]];a=p[a];}return a;}
    for(j=0;j<NR;j++)for(i=0;i<NC;i++){
      var cx2=x0+2*i+1,cy2=y0+2*j+1;
      if(i<NC-1&&isOpen(cx2+1,cy2)){var A=find(j*NC+i),B=find(j*NC+i+1);if(A!==B){p[A]=B;comps--;}}
      if(j<NR-1&&isOpen(cx2,cy2+1)){var A2=find(j*NC+i),B2=find((j+1)*NC+i);if(A2!==B2){p[A2]=B2;comps--;}}
    }
    var guard=400;
    while(comps>1&&guard-->0){
      for(j=0;j<NR;j++)for(i=0;i<NC;i++){
        var cx3=x0+2*i+1,cy3=y0+2*j+1;
        if(i<NC-1){var a1=find(j*NC+i),b1=find(j*NC+i+1);if(a1!==b1&&r()<0.5){opn(cx3+1,cy3);p[a1]=b1;comps--;}}
        if(j<NR-1){var a2=find(j*NC+i),b2=find((j+1)*NC+i);if(a2!==b2&&r()<0.5){opn(cx3,cy3+1);p[a2]=b2;comps--;}}
      }
    }
    var vert=this.vert,n=vert?NC:NR,a0=vert?x0:y0;
    this.n=n;this.a0=a0;this.sgn=(d===0||d===1)?-1:1;
    this.lead=d===0?y0:(d===2?y1:(d===1?x0:x1));
    var seam=this.lead,cntp;
    do{
      cntp=0;
      for(i=0;i<n;i++)this.pf[i]=0;
      for(i=0;i<n;i++)if(r()<0.5){this.pf[i]=1;cntp++;}
    }while(cntp<2);
    for(i=0;i<n;i++){
      var v2=a0+2*i+1,sx=vert?v2:seam,sy=vert?seam:v2;
      if(this.pf[i])opn(sx,sy);
      this.sets[i]=1;
    }
    this.nextSet=2;
  }
};

/* ===================== audio ===================== */
var Snd={ctx:null,master:null,muted:false,count:0,
  unlock:function(){
    if(!this.ctx){
      try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
        this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:0.2;this.master.connect(this.ctx.destination);
      }catch(e){this.ctx=null;}

  },
  setMuted:function(m){this.muted=m;if(this.master)this.master.gain.value=m?0:0.2;},
  tone:function(f,d,type,v,f2,delay){
    var c=this.ctx;if(!c||this.muted)return;
    try{
      var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
      o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
      g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+0.03);this.count++;
    }catch(e){}
  },
  warn:function(){for(var i=0;i<3;i++)this.tone(880,0.07,'square',0.22,null,i*0.12);},
  glitch:function(){this.tone(1100,0.5,'square',0.2,70);this.tone(140,0.6,'triangle',0.4,40);},
  dot:function(){G.wakaI^=1;this.tone(G.wakaI?330:440,0.07,'triangle',0.5,G.wakaI?440:330);},
  power:function(){for(var i=0;i<5;i++)this.tone(300*Math.pow(1.26,i),0.09,'square',0.18,null,i*0.05);},
  eat:function(){this.tone(220,0.22,'square',0.25,1100);},
  die:function(){for(var i=0;i<8;i++)this.tone(700-i*70,0.13,'square',0.22,500-i*60,i*0.1);},
  life:function(){for(var i=0;i<4;i++)this.tone(500*Math.pow(1.335,i),0.1,'square',0.2,null,i*0.08);},
  start:function(){var n=[262,330,392,523];for(var i=0;i<4;i++)this.tone(n[i],0.12,'square',0.2,null,i*0.09);},
  over:function(){for(var i=0;i<5;i++)this.tone(440-i*60,0.25,'triangle',0.4,null,i*0.2);},
  bass:[0,0,12,0,3,3,15,3,-2,-2,10,-2,3,3,15,3],
  music:function(dt){
    if(!this.ctx||this.muted)return;
    G.musicT-=dt;
    if(G.musicT>0)return;
    var iv=0.19-0.06*G.diff;if(G.scare>0)iv*=0.72;
    G.musicT+=iv;if(G.musicT<0)G.musicT=iv;
    var i=G.musicI++&15,n=this.bass[i];
    this.tone(55*Math.pow(2,n/12),iv*1.3,'triangle',0.55);
    if(G.scare>0)this.tone(440*Math.pow(2,this.bass[(i+5)&15]/12),iv*0.8,'square',0.07);
    else if((i&3)===2)this.tone(220*Math.pow(2,n/12),iv*0.6,'square',0.05);
  }
};

function txt(s,x,y,col,sc){
  sc=sc||1;var a=atlas(col);
  for(var i=0;i<s.length;i++){var c=s.charCodeAt(i),g=c<128?FI[c]:-1;if(g>=0)cx.drawImage(a,g*3,0,3,5,x+i*4*sc,y,3*sc,5*sc);}
}
function txtW(s,sc){return s.length*4*sc-sc;}
function txtC(s,y,col,sc){sc=sc||1;txt(s,((W-txtW(s,sc))/2)|0,y,col,sc);}

// pac-man sprites: PAC[mode][color][dir][frame]; mode 0 normal, 1 scared blue, 2 scared white
var PAC=[[],[],[]];
var MOUTH=[0,0.5,0.82];
function mkPac(col,dir,f,mode){
  var m=mk(10,10),c=m[0],x=m[1],ang=[-Math.PI/2,Math.PI,Math.PI/2,0][dir];
  var body=mode===0?col:(mode===1?'#3b66ff':'#f4f4ff');
  x.fillStyle=body;
  for(var py=0;py<10;py++)for(var px=0;px<10;px++){
    var dx=px+0.5-5,dy=py+0.5-5,r2=dx*dx+dy*dy;if(r2>24.6)continue;
    if(f>0&&r2>1.4){var a=Math.atan2(dy,dx)-ang;while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;if(Math.abs(a)<MOUTH[f])continue;}
    x.fillRect(px,py,1,1);
  }
  if(mode===0){ // little dark eye so the facing is readable
    var ex=[1,-1,-1,1][dir]*0,ey=0;x.fillStyle='#000';
    var px2=[6,4,4,5][dir],py2=[4,3,5,3][dir];
    if(dir===0){px2=6;py2=4;} if(dir===2){px2=6;py2=5;}
    x.fillRect(px2,py2,1,1);
  }
  // frightened (mode 1/2): plain blue / white Pac-Man body with chomping mouth, deliberately no face or skirt
  return c;
}
for(var md=0;md<3;md++){
  for(var ci=0;ci<4;ci++){
    PAC[md][ci]=[];
    for(var di=0;di<4;di++){PAC[md][ci][di]=[];for(var fr=0;fr<3;fr++)PAC[md][ci][di][fr]=mkPac(COLORS[ci],di,fr,md);}
  }
}
// ghost sprites: GH[variant][dir][frame]
var GH=[[],[],[]];
var GBODY=['...XXXX...','..XXXXXX..','.XXXXXXXX.','XXXXXXXXXX','XXXXXXXXXX','XXXXXXXXXX','XXXXXXXXXX','XXXXXXXXXX','XXXXXXXXXX'];
function mkGhost(v,dir,f){
  var m=mk(10,10),c=m[0],x=m[1];x.fillStyle=['#ffe600','#fff9a8','#ffffff'][v];
  var rows=GBODY.concat([f?'XX.XXXX.XX':'XXX.XX.XXX']),r,k;
  for(r=0;r<10;r++)for(k=0;k<10;k++)if(rows[r][k]==='X')x.fillRect(k,r,1,1);
  x.fillStyle='#fff';x.fillRect(2,3,2,3);x.fillRect(6,3,2,3);
  x.fillStyle=v===1?'#ff2020':'#2121de';
  var py=dir===0?3:4,pxl=dir===1?2:(dir===3?3:3),pxr=dir===1?6:(dir===3?7:6);
  if(dir===0||dir===2){pxl=3;pxr=6;}
  x.fillRect(pxl,py,1,2);x.fillRect(pxr,py,1,2);
  return c;
}
for(var gv=0;gv<3;gv++){for(var gd=0;gd<4;gd++){GH[gv][gd]=[mkGhost(gv,gd,0),mkGhost(gv,gd,1)];}}
// scanline overlay
var SCAN=(function(){var m=mk(W,H);m[1].fillStyle='rgba(0,0,0,0.16)';for(var y=1;y<H;y+=2)m[1].fillRect(0,y,W,1);return m[0];})();

/* ===================== movement ===================== */
function place(e){
  var d=e.dir;
  if(d<0){e.x=e.tx*T+4;e.y=e.ty*T+4;}
  else{e.x=e.tx*T+4+DX[d]*e.off;e.y=e.ty*T+4+DY[d]*e.off;}
}
function flip(e){
  if(e.dir<0)return;
  if(e.off>0){
    e.tx=M.wx(e.tx+DX[e.dir]);e.ty=M.wy(e.ty+DY[e.dir]);e.off=T-e.off;e.dir^=2;
  }else{
    var d2=e.dir^2;
    if(M.open(e.tx+DX[d2],e.ty+DY[d2]))e.dir=d2;else e.dir=-1;
  }
  place(e);
}
function advance(e,dist,pl){
  var guard=6;
  while(dist>0.0001&&guard-->0){
    if(e.off<=0){
      e.off=0;
      if(pl)decidePlayer(e);else decideEnemy(e);
      if(e.dir<0)break;
    }
    if(e.dir<0){e.off=0;break;}
    var st=T-e.off;if(dist<st)st=dist;
    e.off+=st;dist-=st;
    if(e.off>=T-0.0001){
      e.tx=M.wx(e.tx+DX[e.dir]);e.ty=M.wy(e.ty+DY[e.dir]);e.off=0;
      if(pl)onPlayerTile();
    }
  }
  place(e);
}
function decidePlayer(e){
  var w=e.want;
  if(w>=0&&M.open(e.tx+DX[w],e.ty+DY[w]))e.dir=w;
  else if(e.dir>=0&&!M.open(e.tx+DX[e.dir],e.ty+DY[e.dir]))e.dir=-1;
}
function decideEnemy(e){
  var rev=e.dir<0?-1:(e.dir^2),d,best=-1,tx=e.tx,ty=e.ty;
  if(G.scare>0){
    var n=0;
    for(d=0;d<4;d++)if(d!==rev&&M.open(tx+DX[d],ty+DY[d]))n++;
    if(n>0){var pick=(rnd()*n)|0;for(d=0;d<4;d++)if(d!==rev&&M.open(tx+DX[d],ty+DY[d])){if(pick--===0){best=d;break;}}}
  }else{
    var bd=70000;
    for(d=0;d<4;d++){
      if(d===rev)continue;
      var nx=M.wx(tx+DX[d]),ny=M.wy(ty+DY[d]);
      if(!M.open(nx,ny))continue;
      var nd=e.dist[(nx&63)|((ny&63)<<6)];
      if(nd<bd){bd=nd;best=d;}
    }
  }
  if(best<0&&rev>=0&&M.open(tx+DX[rev],ty+DY[rev]))best=rev;
  e.dir=best;if(best>=0)e.face=best;
}
function onPlayerTile(){
  var idx=(P.tx&63)|((P.ty&63)<<6),v=M.items[idx];
  if(v===1){M.items[idx]=0;addScore(10);Snd.dot();G.dots++;}
  else if(v===2){M.items[idx]=0;addScore(50);startPower();}
}
function addScore(n){
  G.score+=n;G.scoreStr=''+G.score;
  if(G.score>G.hi){G.hi=G.score;G.hiStr=''+G.hi;}
  if(G.score>=G.nextLife){G.nextLife+=5000;if(G.lives<5){G.lives++;Snd.life();}}
}
function startPower(){
  G.scare=7.5-3.5*G.diff;G.chain=0;Snd.power();
  for(var i=0;i<4;i++){var e=E[i];if(e.state===1)flip(e);}
}

/* ===================== camera / direction helpers ===================== */
function viewL(d){return (d&1)?W:VH;}
function leadF(){var d=G.dir;return d===0?-G.camY:(d===2?G.camY+VH:(d===1?-G.camX:G.camX+W));}
function setLeadF(cf){var d=G.dir;if(d===0)G.camY=-cf;else if(d===2)G.camY=cf-VH;else if(d===1)G.camX=-cf;else G.camX=cf-W;}
function fwdOf(x,y,d){return x*DX[d]+y*DY[d];}
/* distance (px) from entity extreme to the inner edge of a wall band of scroll direction wd and thickness wt; <0 = inside the wall */
function gapTo(wd,wt,ex,ey,m){
  if(wd===0)return (G.camY+VH-wt)-(ey+m);
  if(wd===2)return (ey-m)-(G.camY+wt);
  if(wd===1)return (G.camX+W-wt)-(ex+m);
  return (ex-m)-(G.camX+wt);
}
function viewTiles(){ // fills vtx0..vty1
  vtx0=Math.floor(G.camX/T);vty0=Math.floor(G.camY/T);vtx1=vtx0+COLS-1;vty1=vty0+VROWS-1;
}
var vtx0=0,vty0=0,vtx1=0,vty1=0;
function ensureGen(){
  var g=60,d=G.dir;
  viewTiles();
  while(g-->0){
    if(d===0){if(M.y0>vty0-9)M.gen();else break;}
    else if(d===2){if(M.y1<vty1+9)M.gen();else break;}
    else if(d===1){if(M.x0>vtx0-9)M.gen();else break;}
    else{if(M.x1<vtx1+9)M.gen();else break;}
  }
}
function pickDir(cur){var r=(rnd()*3)|0;return r>=cur?r+1:r;}
function oddIn(v,lo,hi){
  if(v<lo)v=lo;if(v>hi)v=hi;
  if((v&1)===0){if(v+1<=hi)v++;else v--;}
  return v;
}
/* put entity on the nearest cell tile (clamped inside the valid rect) */
function toCell(e,tx,ty){
  e.tx=oddIn(tx,M.x0+1,M.x1-1);e.ty=oddIn(ty,M.y0+1,M.y1-1);e.dir=-1;e.off=0;place(e);
}
function midTarget(){ // tile in the middle of the view along the scroll axis, same across position as the player
  viewTiles();
  var tx=P.tx,ty=P.ty;
  if(tx<vtx0)tx=vtx0;if(tx>vtx1)tx=vtx1;if(ty<vty0)ty=vty0;if(ty>vty1)ty=vty1;
  if(G.dir===0||G.dir===2)ty=(vty0+vty1)>>1;else tx=(vtx0+vtx1)>>1;
  snapX=tx;snapY=ty;
}

/* ===================== enemies ===================== */
function bfs(dist,sx,sy){
  dist.fill(65535);
  var x0=M.x0,x1=M.x1,y0=M.y0,y1=M.y1,tiles=M.tiles,h=0,t=1;
  qx[0]=sx;qy[0]=sy;dist[(sx&63)|((sy&63)<<6)]=0;
  while(h<t){
    var x=qx[h],y=qy[h];h++;
    var d=dist[(x&63)|((y&63)<<6)]+1;
    for(var k=0;k<4;k++){
      var nx=M.wx(x+DX[k]),ny=M.wy(y+DY[k]);
      if(nx<x0||nx>x1||ny<y0||ny>y1)continue;
      var ni=(nx&63)|((ny&63)<<6);
      if(tiles[ni]!==0||dist[ni]!==65535)continue;
      dist[ni]=d;qx[t]=nx;qy[t]=ny;t++;
    }
  }
}
function snap(gx,gy){
  var lx=M.x0+1,hx=M.x1-1,ly=M.y0+1,hy=M.y1-1;
  if(gx<lx)gx=lx;else if(gx>hx)gx=hx;
  if(gy<ly)gy=ly;else if(gy>hy)gy=hy;
  if(M.open(gx,gy)){snapX=gx;snapY=gy;return;}
  var best=1e9;snapX=P.tx;snapY=P.ty;
  for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){
    var x=gx+dx,y=gy+dy;if(x<M.x0||x>M.x1||y<M.y0||y>M.y1)continue;
    var d=dx*dx+dy*dy;if(d<best&&M.open(x,y)){best=d;snapX=x;snapY=y;}
  }
}
function cornerTarget(kind){
  viewTiles();
  var d=G.dir,lead=kind<2,gx,gy;
  if(d===0||d===2){
    gx=(kind&1)?vtx0+2:vtx1-2;
    if(d===0)gy=lead?vty0+3:vty1-6;else gy=lead?vty1-3:vty0+6;
  }else{
    gy=(kind&1)?vty0+3:vty1-3;
    if(d===1)gx=lead?vtx0+3:vtx1-6;else gx=lead?vtx1-3:vtx0+6;
  }
  snap(gx,gy);
}
function retarget(e){
  var gx=P.tx,gy=P.ty,k=e.kind,f=P.face;
  if(!G.chase){cornerTarget(k);}
  else{
    if(k===0){snap(gx,gy);}
    else if(k===1){snap(gx+DX[f]*4,gy+DY[f]*4);}
    else if(k===2){
      var r=E[0];
      if(r.state===1){var px=gx+DX[f]*2,py=gy+DY[f]*2;snap(px*2-r.tx,py*2-r.ty);}
      else snap(gx,gy);
    }else{
      var dx=e.tx-gx,dy=e.ty-gy;
      if(dx*dx+dy*dy>64)snap(gx,gy);else cornerTarget(3);
    }
  }
  bfs(e.dist,snapX,snapY);
  if(e.dist[(e.tx&63)|((e.ty&63)<<6)]===65535){if(++e.lost>4){e.state=0;e.timer=0.4;e.lost=0;}}else e.lost=0;
}
var KSPD=[1.0,0.97,0.95,0.92];
function spawnEnemy(e){
  viewTiles();
  var d=G.dir,vert=(d===0||d===2),bestD=-1,bx=0,by=0,i,k,a,c,tx,ty;
  for(i=0;i<8;i++){
    k=3+((rnd()*5)|0);
    a=d===0?vty0+k:(d===2?vty1-k:(d===1?vtx0+k:vtx1-k));
    if((a&1)===0)a+=(d===0||d===1)?1:-1;
    if(vert){tx=M.x0+1+2*((rnd()*9)|0);ty=a;}else{ty=M.y0+1+2*((rnd()*16)|0);tx=a;}
    if(!M.open(tx,ty))continue;
    var dx=tx-P.tx,dy=ty-P.ty,dd=dx*dx+dy*dy;
    if(dd>bestD){bestD=dd;bx=tx;by=ty;}
    if(dd>144)break;
  }
  if(bestD<0){e.state=0;e.timer=0.5;return;}
  e.tx=bx;e.ty=by;e.dir=-1;e.off=0;e.state=1;e.grace=1.3;e.bt=0;e.face=2;e.lost=0;
  place(e);retarget(e);
}
function updEnemy(e,dt){
  if(e.state===0){e.timer-=dt;if(e.timer<=0)spawnEnemy(e);return;}
  if(e.grace>0)e.grace-=dt;
  var scared=G.scare>0;
  if(!scared){e.bt-=dt;if(e.bt<=0){e.bt=0.2+0.05*e.kind;retarget(e);if(e.state!==1)return;}}
  var sp=(4.0+1.7*G.diff)*KSPD[e.kind]*(scared?0.5:1);
  if(e.grace>0)sp*=0.6;
  advance(e,sp*T*dt,false);
  if(!M.inRect(e.tx,e.ty)||(G.w1t>0&&gapTo(G.w1d,G.w1t,e.x,e.y,0)<-4)){e.state=0;e.timer=1.5;}
}
function sendAway(e,delay){e.state=0;e.timer=delay;}

/* ===================== game flow ===================== */
function resetEnemies(){
  var tm=[2.0,6.0,25,45];
  for(var i=0;i<4;i++){E[i].state=0;E[i].timer=tm[i];E[i].dir=-1;E[i].off=0;E[i].grace=0;}
}
function startGame(seed){
  Snd.unlock();Snd.start();
  if(seed===undefined||seed===null)seed=(Math.random()*4294967295)>>>0;
  G.seed=seed;rnd=mkRng(seed^0xabcdef);
  M.reset(seed);
  G.score=0;G.scoreStr='0';G.lives=3;G.time=0;G.diff=0;G.scare=0;G.chain=0;G.inv=2.0;G.chase=false;G.modeT=3;G.nextLife=5000;
  G.newHi=false;G.hiStart=G.hiSaved;G.dots=0;G.musicT=0;G.musicI=0;G.why='';G.overT=0;G.dyingT=0;G.dist=0;
  G.dir=0;G.nextDir=pickDir(0);G.phaseT=0;G.phaseLen=TURNLEN;G.ho=0;G.warn=false;G.warned=false;G.rampT=0;G.rampLen=5;
  G.w1d=0;G.w1t=WALLH;G.w0d=0;G.w0t=0;G.flash=0;G.switches=0;
  P.tx=9;P.ty=-3;P.dir=-1;P.off=0;P.want=-1;P.face=0;G.wantT=0;place(P);
  G.camX=0;G.camY=P.y-0.68*VH;
  ensureGen();
  M.items[(P.tx&63)|((P.ty&63)<<6)]=0;
  resetEnemies();
  for(var i=0;i<POP.length;i++)POP[i].t=0;
  G.state='play';
  G.hiStr=''+G.hi;
  updButtons();
}
function respawn(){
  midTarget();
  toCell(P,snapX,snapY);P.want=-1;G.wantT=0;
  var ti=(P.tx&63)|((P.ty&63)<<6);M.items[ti]=0;
  G.inv=2.8;
  for(var i=0;i<4;i++){var e=E[i];if(e.state===1){var dx=e.tx-P.tx,dy=e.ty-P.ty;if(dx*dx+dy*dy<64)sendAway(e,2.0);}}
  G.state='play';
}
function kill(why){
  if(G.state!=='play')return;
  G.lives--;G.state='dying';G.dyingT=1.1;G.why=why;Snd.die();saveHi();
}
function gameOver(){
  G.state='over';G.overT=0;
  G.newHi=G.score>0&&G.score>G.hiStart;
  saveHi();Snd.over();updButtons();
}
G.hiSaved=0;G.hiStart=0;
function saveHi(){
  if(G.score>G.hiSaved){G.hiSaved=G.score;lsSet('ghost256.hi',''+G.hiSaved);}
  if(G.hiSaved>G.hi){G.hi=G.hiSaved;}
  G.hiStr=''+G.hi;
}
function popup(x,y,s){
  for(var i=0;i<POP.length;i++){var p=POP[i];if(p.t<=0){p.t=1.0;p.x=x;p.y=y;p.s=s;return;}}
}
/* change the scroll direction: re-base the maze on the aligned view window, move the wall, keep everyone valid */
function switchDir(b){
  var a=G.dir;
  var wx0=2*Math.round(G.camX/16),wy0=2*Math.round(G.camY/16);
  var minX=(M.x0+1)&~1,maxX=(M.x1-18)&~1,minY=(M.y0+1)&~1,maxY=(M.y1-32)&~1;
  if(maxX<minX)maxX=minX;if(maxY<minY)maxY=minY;
  if(wx0<minX)wx0=minX;if(wx0>maxX)wx0=maxX;if(wy0<minY)wy0=minY;if(wy0>maxY)wy0=maxY;
  M.switchTo(b,wx0,wy0);
  G.camX=wx0*T;G.camY=wy0*T;
  G.w0d=G.w1d;G.w0t=(G.w1t>0&&G.ho<=0)?G.w1t:G.w0t;
  G.dir=b;G.w1d=b;G.w1t=0;
  G.ho=HOLEN;G.rampT=0;G.rampLen=1.5;G.flash=0.45;G.switches++;
  G.nextDir=pickDir(b);G.warn=false;G.warned=false;
  if(G.inv<HOLEN+1.0)G.inv=HOLEN+1.0;
  // enemies: anything now in a wall / outside the window goes back to the spawner
  var i,e;
  for(i=0;i<4;i++){
    e=E[i];e.dist.fill(65535);e.bt=0;
    if(e.state===1){
      var bad=!M.open(e.tx,e.ty)||(e.dir>=0&&!M.open(e.tx+DX[e.dir],e.ty+DY[e.dir]));
      if(bad){e.state=0;e.timer=1.0;}
    }
  }
  // player
  var pbad=!M.open(P.tx,P.ty)||(P.dir>=0&&!M.open(P.tx+DX[P.dir],P.ty+DY[P.dir]))||gapTo(b,WALLH,P.x,P.y,3)<32;
  if(pbad){midTarget();toCell(P,snapX,snapY);P.want=-1;G.wantT=0;M.items[(P.tx&63)|((P.ty&63)<<6)]=0;}
  for(i=0;i<POP.length;i++)POP[i].t=0;
  ensureGen();
  for(i=0;i<4;i++){e=E[i];if(e.state===1)retarget(e);}
  Snd.glitch();
}
function playStep(dt){
  G.time+=dt;
  var diff=G.time/360;if(diff>1)diff=1;G.diff=diff;
  G.lvl=((G.time/40)|0)%6;
  G.modeT-=dt;if(G.modeT<=0){G.chase=!G.chase;G.modeT=G.chase?11:(3.8-2.2*diff);}
  // direction schedule: sound cue 2s ahead (no on-screen text), switch every phaseLen seconds of play
  if(G.ho>0){G.ho-=dt;if(G.ho<0)G.ho=0;}
  G.phaseT+=dt;
  if(!G.warned&&G.phaseT>=G.phaseLen-WARNLEN){G.warned=true;G.warn=true;Snd.warn();}
  if(G.phaseT>=G.phaseLen){G.phaseT-=G.phaseLen;switchDir(G.nextDir);}
  if(G.flash>0)G.flash-=dt;
  // wall bands animate during the handover
  if(G.ho>0){G.w1t=WALLH*(1-G.ho/HOLEN);G.w0t=WALLH*(G.ho/HOLEN);}
  else{G.w1t=WALLH;G.w0t=0;}
  // scroll
  var cf0=leadF(),cf=cf0;
  if(G.ho<=0)G.rampT+=dt;
  var ramp=G.rampT/G.rampLen;if(ramp>1)ramp=1;
  cf+=(1.0+2.3*diff)*ramp*T*dt;
  if(G.wantT>0){G.wantT-=dt;if(G.wantT<=0)P.want=-1;}
  advance(P,(5.7+0.7*diff)*T*dt,true);
  if(P.dir>=0)P.face=P.dir;
  var tgt=fwdOf(P.x,P.y,G.dir)+0.42*viewL(G.dir);
  if(tgt>cf)cf+=(tgt-cf)*Math.min(1,dt*8);
  setLeadF(cf);
  G.dist+=cf-cf0;
  ensureGen();
  if(G.inv>0)G.inv-=dt;
  if(G.scare>0){G.scare-=dt;if(G.scare<0)G.scare=0;}
  var i,e;
  for(i=0;i<4;i++)updEnemy(E[i],dt);
  for(i=0;i<4;i++){
    e=E[i];if(e.state!==1||e.grace>0)continue;
    var dx=e.x-P.x,dy=e.y-P.y,d2=dx*dx+dy*dy;
    if(G.scare>0){
      if(d2<42){
        var pts=200<<G.chain;if(G.chain<3)G.chain++;
        addScore(pts);popup(e.x,e.y,''+pts);Snd.eat();e.state=0;e.timer=5.0;
      }
    }else if(G.inv<=0&&d2<26){kill('pac');break;}
  }
  if(G.state==='play'&&gapTo(G.w1d,G.w1t,P.x,P.y,3)<0)kill('wall');
  for(i=0;i<POP.length;i++)if(POP[i].t>0){POP[i].t-=dt;POP[i].y-=8*dt;}
  Snd.music(dt);
}
function attract(dt){
  G.attractT+=dt;
  if(!G.attractInit){G.attractInit=true;M.reset(777);G.dir=0;G.camX=0;G.camY=-VH+40;}
  G.camY-=14*dt;
  ensureGen();
}
function update(dt){
  G.upd++;
  if(G.state==='play')playStep(dt);
  else if(G.state==='dying'){
    G.dyingT-=dt;
    if(G.dyingT<=0){if(G.lives<=0)gameOver();else respawn();}
  }else if(G.state==='title')attract(dt);
  else if(G.state==='over')G.overT+=dt;
}

/* ===================== rendering ===================== */
var cxr=0,cyr=0;
function drawMaze(){
  var pal=PAL[G.state==='play'||G.state==='pause'||G.state==='dying'||G.state==='over'?G.lvl:0];
  var edge=pal[0],fill=pal[1];
  if(G.scare>0){edge=(G.scare<1.6&&(((G.anim*8)|0)&1))?'#ffffff':'#a040ff';}
  var tx0=Math.floor(cxr/T),ty0=Math.floor(cyr/T),ty,tx;
  cx.fillStyle='#000';cx.fillRect(0,HUD,W,VH);
  var m=M;
  for(ty=ty0;ty<=ty0+VROWS;ty++){
    var py=HUD+ty*T-cyr;
    for(tx=tx0;tx<=tx0+COLS;tx++){
      var px=tx*T-cxr;
      if(m.open(tx,ty)){
        var it=m.item(tx,ty);
        if(it===1){cx.fillStyle='#ffcfb0';cx.fillRect(px+3,py+3,2,2);}
        else if(it===2){
          if(((G.anim*6)|0)&1){cx.fillStyle='#ffcfb0';cx.fillRect(px+1,py,6,8);cx.fillRect(px,py+1,8,6);}
        }
        continue;
      }
      cx.fillStyle=fill;cx.fillRect(px,py,T,T);
      cx.fillStyle=edge;
      var oU=m.open(tx,ty-1),oD=m.open(tx,ty+1),oL=m.open(tx-1,ty),oR=m.open(tx+1,ty);
      if(oU)cx.fillRect(px,py,T,1);
      if(oD)cx.fillRect(px,py+T-1,T,1);
      if(oL)cx.fillRect(px,py,1,T);
      if(oR)cx.fillRect(px+T-1,py,1,T);
      if(!oU&&!oL&&m.open(tx-1,ty-1))cx.fillRect(px,py,1,1);
      if(!oU&&!oR&&m.open(tx+1,ty-1))cx.fillRect(px+T-1,py,1,1);
      if(!oD&&!oL&&m.open(tx-1,ty+1))cx.fillRect(px,py+T-1,1,1);
      if(!oD&&!oR&&m.open(tx+1,ty+1))cx.fillRect(px+T-1,py+T-1,1,1);
    }
  }
}
var fseq=[0,1,2,1];
function drawEnemies(){
  for(var i=0;i<4;i++){
    var e=E[i];if(e.state!==1)continue;
    if(e.grace>0&&(((e.grace*14)|0)&1))continue;
    var mode=0;
    if(G.scare>0){mode=(G.scare<1.6&&(((G.anim*8)|0)&1))?2:1;}
    var f=fseq[((G.anim*12)|0)&3];
    cx.drawImage(PAC[mode][i][e.face][f],0,0,10,10,Math.round(e.x-5)-cxr,Math.round(e.y-5)-cyr+HUD,10,10);
  }
}
function drawPlayer(){
  var v=0,f=((G.anim*8)|0)&1,d=P.face,sx=Math.round(P.x)-cxr,sy=Math.round(P.y)-cyr+HUD;
  if(G.state==='dying'){
    var k=1-G.dyingT/1.1,s=1-k;if(s<0.05)return;
    var spr=GH[(((G.anim*14)|0)&1)?2:0][d][0],sz=Math.max(1,Math.round(10*s));
    cx.drawImage(spr,0,0,10,10,Math.round(sx-sz/2),Math.round(sy-sz/2),sz,sz);return;
  }
  if(G.inv>0&&(((G.inv*12)|0)&1))return;
  if(G.scare>0)v=(((G.anim*10)|0)&1)?1:0;
  cx.drawImage(GH[v][d][f],0,0,10,10,sx-5,sy-5,10,10);
}
function band(d,u,v,l,dep,col){ // v measured from the outer screen edge inwards
  cx.fillStyle=col;
  if(d===0)cx.fillRect(u,HUD+VH-v-dep,l,dep);
  else if(d===2)cx.fillRect(u,HUD+v,l,dep);
  else if(d===1)cx.fillRect(W-v-dep,HUD+u,dep,l);
  else cx.fillRect(v,HUD+u,dep,l);
}
var GCOL=['#ff00ff','#00ffff','#ffffff','#2f3cff','#ff2020','#00ff66'];
function drawWallBand(d,t,near){
  if(t<0.6)return;
  var tt=Math.round(t),len=(d&1)?VH:W,i,v,u,rn=Math.random;
  band(d,0,0,len,tt,'#000');
  for(u=0;u<len;u+=4){var h=(rn()*5)|0;band(d,u,tt,4,h+1,GCOL[(rn()*6)|0]);}
  for(v=0;v<tt;v+=2){
    var n=near?7:4;
    for(i=0;i<n;i++)band(d,(rn()*len)|0,v,2+((rn()*(near?40:24))|0),1+((rn()*2)|0),GCOL[(rn()*6)|0]);
    if(rn()<0.3)band(d,(rn()*len)|0,v,10+((rn()*30)|0),2,'#000');
  }
  // displaced slice of maze next to the wall (glitch shimmer)
  var off=((rn()*9)|0)-4,hh=2+((rn()*3)|0);
  if(d===0){var ys=HUD+VH-tt-10;cx.drawImage(cv,0,ys,W,hh,off,ys,W,hh);}
  else if(d===2){var ys2=HUD+tt+4;cx.drawImage(cv,0,ys2,W,hh,off,ys2,W,hh);}
  else if(d===1){var xs=W-tt-10;cx.drawImage(cv,xs,HUD,hh,VH,xs,HUD+off,hh,VH);}
  else{var xs2=tt+4;cx.drawImage(cv,xs2,HUD,hh,VH,xs2,HUD+off,hh,VH);}
}
function drawWall(){
  var near=G.state==='play'&&gapTo(G.w1d,G.w1t,P.x,P.y,3)<48;
  drawWallBand(G.w0d,G.w0t,false);
  drawWallBand(G.w1d,G.w1t,near);
}
function arrow(x,y,d,col){ // 11x11 pixel arrow
  cx.fillStyle=col;
  var r;
  for(r=0;r<6;r++)seg(x,y,d,5-r,r,1+2*r,1);
  seg(x,y,d,4,6,3,5);
}
function seg(x,y,d,u,v,w,h){ // rectangle given in an "up-pointing" frame, rotated to direction d
  if(d===0)cx.fillRect(x+u,y+v,w,h);
  else if(d===2)cx.fillRect(x+u,y+11-v-h,w,h);
  else if(d===1)cx.fillRect(x+v,y+u,h,w);
  else cx.fillRect(x+11-v-h,y+u,h,w);
}
function drawHUD(){
  cx.fillStyle='#000';cx.fillRect(0,0,W,HUD);
  cx.fillStyle='#202060';cx.fillRect(0,HUD-1,W,1);
  txt('SCORE',2,0,'#8888cc');txt(G.scoreStr,2,6,'#ffffff');
  var hs='HI',hx=W-2-txtW(G.hiStr,1);
  txt(hs,W-2-txtW(hs,1),0,'#8888cc');
  txt(G.hiStr,hx,6,G.score>=G.hi&&G.score>0?'#ffe600':'#ffffff');
  var n=G.lives>0?G.lives:0,lx=((W-n*9)/2)|0;
  for(var i=0;i<n;i++)cx.drawImage(GH[0][3][0],0,0,10,10,lx+i*9,1,10,10);
  arrow(100,0,G.dir,'#4a5aff');
  if(G.scare>0){cx.fillStyle='#a040ff';cx.fillRect(0,HUD-2,Math.round(W*G.scare/(7.5-3.5*G.diff)),1);}
}
function drawPopups(){
  for(var i=0;i<POP.length;i++){var p=POP[i];if(p.t>0){var w=txtW(p.s,1);txt(p.s,Math.round(p.x-w/2)-cxr,Math.round(p.y)-cyr+HUD-3,'#00ffff');}}
}
function dim(a){cx.fillStyle='rgba(0,0,0,'+a+')';cx.fillRect(0,0,W,H);}
function panel(y,h,a){cx.fillStyle='rgba(0,0,0,'+a+')';cx.fillRect(4,y,W-8,h);}
function drawTitle(){
  var t=G.anim;
  dim(0.6);
  var j=(((t*10)|0)%17===0)?((Math.random()*5)|0)-2:0;
  var gl=(((t*7)|0)%11===0);
  txtC('GHOST',18+(gl?1:0),'#00ffff',5);
  txt('GHOST',((W-txtW('GHOST',5))/2|0)+2+j,20,'#ff0000',5);
  txtC('GHOST',19,'#ffe600',5);
  var tx=((W-txtW('256',8))/2|0);
  txt('256',tx-1+j,50,'#ff0000',8);txt('256',tx+2,52,'#00ffff',8);txt('256',tx,51,'#ffffff',8);
  panel(97,22,0.65);
  var ph=((t/6)|0)&1,L=W+90,pos=(t*38)%L;
  var gx,i;
  if(!ph){gx=pos-20;cx.drawImage(GH[0][3][((t*8)|0)&1],0,0,10,10,Math.round(gx),102,10,10);
    for(i=0;i<4;i++)cx.drawImage(PAC[0][i][3][fseq[((t*12)|0)&3]],0,0,10,10,Math.round(gx-14-i*13),102,10,10);}
  else{var gp=L-pos-70;cx.drawImage(GH[((t*10)|0)&1?1:0][1][((t*8)|0)&1],0,0,10,10,Math.round(gp),102,10,10);
    for(i=0;i<4;i++)cx.drawImage(PAC[1][i][1][fseq[((t*12)|0)&3]],0,0,10,10,Math.round(gp-14-i*13),102,10,10);}
  panel(122,54,0.7);
  var lg=['RED: CHASES YOU','PINK: AMBUSHES AHEAD','CYAN: FLANKS VIA RED','ORANGE: SHY WHEN CLOSE'];
  for(i=0;i<4;i++){
    cx.drawImage(PAC[0][i][3][fseq[((t*8+i)|0)&3]],0,0,10,10,12,123+i*13,10,10);
    txt(lg[i],28,126+i*13,COLORS[i]);
  }
  panel(178,78,0.7);
  var help=['EAT DOTS. DODGE THE PAC-MEN!','POWER PELLET: EAT THEM BACK!','GLITCH WALL PUSHES FROM BEHIND.','TOUCH IT OR GET CAUGHT = LOSE A LIFE','EVERY 15 SEC THE SCROLL TURNS:','UP, DOWN, LEFT OR RIGHT. THE WALL','MOVES TO THE SIDE THAT PUSHES YOU!','3 LIVES. EXTRA LIFE PER 5000 PTS.','SWIPE / ARROWS / WASD / D-PAD','P OR ESC: PAUSE   M: MUTE'];
  for(i=0;i<help.length;i++)txtC(help[i],181+i*7.5|0,i<4||i===7?'#ffffff':(i<7?'#00ffff':'#ffe600'),1);
  if(((t*2)|0)&1)txtC('TAP OR PRESS SPACE TO START',259,'#ffe600',1);
  txtC('HI '+G.hi,267,'#8888cc',1);
}
function drawOver(){
  dim(0.72);
  txtC('GAME OVER',60,'#ff0000',4);
  txtC(G.why==='wall'?'SWALLOWED BY THE GLITCH':'CAUGHT BY A PAC-MAN',100,'#8888cc',1);
  txtC('SCORE',122,'#8888cc',1);txtC(''+G.score,130,'#ffffff',3);
  txtC('BEST',156,'#8888cc',1);txtC(''+G.hi,164,'#ffe600',2);
  txtC('DISTANCE '+(Math.max(0,(G.dist/16)|0)),188,'#00ffff',1);
  if(G.newHi&&(((G.anim*4)|0)&1))txtC('NEW HIGH SCORE!',206,'#ffe600',1);
  if(G.overT>0.8&&(((G.anim*2)|0)&1))txtC('TAP OR PRESS SPACE TO RETRY',236,'#ffffff',1);
}
function drawPause(){
  dim(0.7);
  txtC('PAUSED',100,'#ffe600',4);
  txtC('TAP OR PRESS P TO RESUME',140,'#ffffff',1);
  txtC('SCORE '+G.score,160,'#8888cc',1);
}
function render(){
  var t0=performance.now();
  cxr=Math.round(G.camX);cyr=Math.round(G.camY);
  cx.imageSmoothingEnabled=false;
  drawMaze();
  if(G.state!=='title'){
    drawEnemies();drawPlayer();drawPopups();drawWall();
    drawHUD();
    if(G.flash>0){ // glitch burst while the maze is re-based
      var fr=Math.random,k;
      for(k=0;k<14;k++){cx.fillStyle=GCOL[(fr()*6)|0];cx.fillRect(0,HUD+((fr()*VH)|0),W,1+((fr()*2)|0));}
      for(k=0;k<6;k++){var yy=HUD+((fr()*VH)|0),hh=2+((fr()*6)|0);cx.drawImage(cv,0,yy,W,hh,((fr()*21)|0)-10,yy,W,hh);}
    }
    if(G.state==='pause')drawPause();
    else if(G.state==='over')drawOver();
  }else{
    drawTitle();
  }
  cx.drawImage(SCAN,0,0);
  G.rend=performance.now()-t0;
}

/* ===================== input ===================== */
function setWant(d){
  if(G.state!=='play')return;
  P.want=d;G.wantT=1.0;
  if(P.dir>=0&&d===(P.dir^2)&&P.off>0){flip(P);P.face=P.dir;}
}
function anyStart(){
  if(G.state==='title'){startGame();return true;}
  if(G.state==='over'&&G.overT>0.8){startGame();return true;}
  if(G.state==='pause'){togglePause();return true;}
  return false;
}
function togglePause(){
  if(G.state==='play'||G.state==='dying'){G.pausedFrom=G.state;G.state='pause';}
  else if(G.state==='pause'){G.state=G.pausedFrom;}
  updButtons();
}
function autoPause(){if(G.state==='play'||G.state==='dying')togglePause();}
function toggleMute(){
  G.muted=!G.muted;Snd.setMuted(G.muted);lsSet('ghost256.mute',G.muted?'1':'0');updButtons();
}
function togglePad(){G.pad=!G.pad;lsSet('ghost256.pad',G.pad?'1':'0');updButtons();fit();}
var bP=document.getElementById('bPause'),bM=document.getElementById('bMute'),bD=document.getElementById('bPad'),padEl=document.getElementById('pad');
function updButtons(){
  bP.textContent=G.state==='pause'?'RESUME':'PAUSE';
  bP.className='btn'+((G.state==='play'||G.state==='pause'||G.state==='dying')?'':' off');
  bM.textContent=G.muted?'SOUND: OFF':'SOUND: ON';bM.className='btn'+(G.muted?' off':'');
  bD.textContent=G.pad?'D-PAD: ON':'D-PAD: OFF';bD.className='btn'+(G.pad?'':' off');
  padEl.style.display=G.pad?'flex':'none';
}
var KEYD={ArrowUp:0,ArrowLeft:1,ArrowDown:2,ArrowRight:3,KeyW:0,KeyA:1,KeyS:2,KeyD:3,w:0,a:1,s:2,d:3,W:0,A:1,S:2,D:3};
window.addEventListener('keydown',function(ev){
  Snd.unlock();
  var k=ev.code||ev.key,kd=KEYD[k];if(kd===undefined)kd=KEYD[ev.key];
  if(kd!==undefined){
    ev.preventDefault();
    if(G.state==='play')setWant(kd);
    else if(G.state==='title'||G.state==='over'){if(anyStart())setWant(kd);}
    return;
  }
  if(ev.key==='p'||ev.key==='P'||ev.key==='Escape'||k==='KeyP'){ev.preventDefault();if(!ev.repeat)togglePause();return;}
  if(ev.key==='m'||ev.key==='M'||k==='KeyM'){if(!ev.repeat)toggleMute();return;}
  if(ev.key===' '||ev.key==='Enter'||k==='Space'){ev.preventDefault();if(!ev.repeat)anyStart();}
},{passive:false});
// swipe / drag
var sw={id:-1,x:0,y:0,moved:false};
document.addEventListener('pointerdown',function(ev){
  Snd.unlock();
  if(ev.target.closest&&ev.target.closest('button'))return;
  sw.id=ev.pointerId;sw.x=ev.clientX;sw.y=ev.clientY;sw.moved=false;
  if(anyStart())sw.moved=true;
},{passive:false});
document.addEventListener('pointermove',function(ev){
  if(ev.pointerId!==sw.id)return;
  var dx=ev.clientX-sw.x,dy=ev.clientY-sw.y,ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax<14&&ay<14)return;
  var d=ax>ay?(dx<0?1:3):(dy<0?0:2);
  sw.x=ev.clientX;sw.y=ev.clientY;sw.moved=true;
  setWant(d);
},{passive:false});
function endPtr(ev){if(ev.pointerId===sw.id)sw.id=-1;}
document.addEventListener('pointerup',endPtr);document.addEventListener('pointercancel',endPtr);
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
bP.addEventListener('click',function(){Snd.unlock();togglePause();});
bM.addEventListener('click',function(){Snd.unlock();toggleMute();});
bD.addEventListener('click',function(){Snd.unlock();togglePad();});
var pads=padEl.querySelectorAll('.d');
for(var pdi=0;pdi<pads.length;pdi++){
  (function(b){
    b.addEventListener('pointerdown',function(ev){ev.preventDefault();ev.stopPropagation();Snd.unlock();var d=+b.getAttribute('data-d');if(G.state==='play')setWant(d);else{if(anyStart())setWant(d);}});
  })(pads[pdi]);
}
document.addEventListener('visibilitychange',function(){if(document.hidden)autoPause();});
window.addEventListener('pagehide',autoPause);

/* ===================== layout ===================== */
var wrapEl=document.getElementById('wrap');
function fit(){
  var aw=wrapEl.clientWidth,ah=wrapEl.clientHeight,dpr=window.devicePixelRatio||1;
  if(aw<=0||ah<=0)return;
  var s=Math.min(aw*dpr/W,ah*dpr/H),fl=Math.floor(s);
  var use=(fl>=1&&fl/s>0.86)?fl:s;
  cv.style.width=(W*use/dpr)+'px';cv.style.height=(H*use/dpr)+'px';
}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(wrapEl);

/* ===================== main loop ===================== */
var last=0,acc=0;
function frame(ts){
  window.requestAnimationFrame(frame);
  var dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0;if(dt>0.1)dt=0.1;
  acc+=dt;G.anim+=dt;
  var n=0,t0=performance.now();
  if(G.freeze)acc=0;else while(acc>=STEP&&n<6){update(STEP);acc-=STEP;n++;}
  if(n===6)acc=0;
  render();
  G.frames++;
  G.fpsAvg+=((dt*1000||16.7)-G.fpsAvg)*0.05;
  G.frameMs=performance.now()-t0;
}

/* ===================== init ===================== */
(function init(){
  var hi=parseInt(lsGet('ghost256.hi'),10);if(hi>0){G.hi=hi;G.hiSaved=hi;}G.hiStr=''+G.hi;
  G.muted=lsGet('ghost256.mute')==='1';Snd.muted=G.muted;
  G.pad=lsGet('ghost256.pad')==='1';
  M.reset(777);G.dir=0;G.camX=0;G.camY=-VH+40;G.attractInit=true;
  ensureGen();
  place(P);updButtons();fit();
  window.requestAnimationFrame(frame);
})();

/* debug / test hook (harmless in production) */
window.__ghost={G:G,P:P,E:E,M:M,Snd:Snd,COLS:COLS,T:T,VROWS:VROWS,DX:DX,DY:DY,HOLEN:HOLEN,WALLH:WALLH,
  step:function(n){for(var i=0;i<n;i++)update(STEP);},
  render:render,startGame:startGame,setWant:setWant,togglePause:togglePause,toggleMute:toggleMute,
  teleport:function(tx,ty){P.tx=tx;P.ty=ty;P.dir=-1;P.off=0;place(P);onPlayerTile();},
  findPower:function(){
    viewTiles();for(var y=vty1;y>=vty0;y--)for(var x=vtx0;x<=vtx1;x++)if(M.item(x,y)===2)return [x,y];return null;},
  view:function(){viewTiles();return {x0:vtx0,y0:vty0,x1:vtx1,y1:vty1};},
  forceDir:function(d){if(G.state!=='play')return false;G.phaseT=0;switchDir(d);return true;},
  gapAtTile:function(tx,ty){return gapTo(G.w1d,Math.max(G.w1t,0.01),tx*T+4,ty*T+4,3);},
  wallGap:function(){return gapTo(G.w1d,G.w1t,P.x,P.y,3);},
  fwd:fwdOf,viewL:viewL,
  kill:kill,gameOver:gameOver,mkRng:mkRng,sprites:{PAC:PAC,GH:GH}
};
})();
</script>
